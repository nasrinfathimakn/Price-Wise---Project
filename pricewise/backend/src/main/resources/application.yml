server:
  port: ${PORT:8080}

spring:
  application:
    name: pricewise-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

pricewise:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  retailers:
    amazon:
      enabled: ${AMAZON_INTEGRATION_ENABLED:false}
      api-key: ${AMAZON_API_KEY:}
      api-secret: ${AMAZON_API_SECRET:}
      associate-tag: ${AMAZON_ASSOCIATE_TAG:}
      endpoint: ${AMAZON_API_ENDPOINT:https://webservices.amazon.in/paapi5}
      timeout-ms: 5000
    flipkart:
      enabled: ${FLIPKART_INTEGRATION_ENABLED:false}
      affiliate-id: ${FLIPKART_AFFILIATE_ID:}
      affiliate-token: ${FLIPKART_AFFILIATE_TOKEN:}
      endpoint: ${FLIPKART_API_ENDPOINT:https://affiliate-api.flipkart.net/affiliate}
      timeout-ms: 5000
    sync:
      scheduled-rate-ms: ${SYNC_SCHEDULED_RATE_MS:3600000} # 1 hour
      freshness-threshold-hours: ${FRESHNESS_THRESHOLD_HOURS:12}
  alerts:
    evaluation-rate-ms: ${ALERT_EVALUATION_RATE_MS:1800000} # 30 mins
  mail:
    configured: ${MAIL_CONFIGURED:false}
    from: ${MAIL_FROM:alerts@pricewise.local}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

